CONFIG_ZMK_DISPLAY=y
CONFIG_I2C=y

# CONFIG_ZMK_STUDIO=y

CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_WIDGET_LAYER_STATUS=n
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=n

CONFIG_ZMK_POINTING=y
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=10000
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
#CONFIG_NICE_OLED_GEM_ANIMATION=n
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# RGB e OLED
# Desativa os LEDs ao iniciar / acordar do standby
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n

# Salva as alterações de estado no Flash (sintaxe correta com prefixo CONFIG_)
CONFIG_ZMK_SETTINGS_SAVE_ON_EACH_CHANGE=y

CONFIG_WS2812_STRIP=y

# EXT_POWER = n garante que a placa nunca tente desligar a energia da tela e travar ela
CONFIG_ZMK_EXT_POWER=n
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
