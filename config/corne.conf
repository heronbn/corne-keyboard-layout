CONFIG_ZMK_DISPLAY=y
CONFIG_I2C=y

CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_WIDGET_LAYER_STATUS=n
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=n

CONFIG_ZMK_EXT_POWER=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=10000
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
#CONFIG_NICE_OLED_GEM_ANIMATION=n
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Habilita o RGB (Per-key e Underglow compartilham a mesma fita de LEDs no Corne)
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# Brilho inicial baixo para evitar queda de energia (Brownout) que desliga o OLED
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=5

# O RGB vai iniciar ligado para você ver que está funcionando
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y

# Evita que o comando RGB_TOG desligue a energia do OLED (VCC)
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n